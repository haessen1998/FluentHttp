name: .NET

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ReadableHttp.sln

      - name: Build
        run: dotnet build ReadableHttp.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ReadableHttp.Tests/ReadableHttp.Tests.csproj --configuration Release --no-build

      - name: Pack
        shell: pwsh
        run: ./scripts/pack.ps1
